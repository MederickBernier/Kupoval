services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            STRIPE_KEY: '${STRIPE_KEY}'
            STRIPE_SECRET: '${STRIPE_SECRET}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - kupoval_sail
        depends_on:
            - pgsql
            - redis

    pgsql:
        image: 'postgres:17'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    pgadmin:
        image: dpage/pgadmin4
        container_name: sail-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@kupoval.art
            PGADMIN_DEFAULT_PASSWORD: QXyVvtM7wmALCR8DapTr
        ports:
            - '5050:80'
        depends_on:
            - pgsql
        networks:
            - sail

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    stripe-cli:
        image: stripe/stripe-cli
        container_name: stripe-cli
        environment:
            - STRIPE_API_KEY=${STRIPE_SECRET}
            - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
        entrypoint: []
        command: >
            sh -c "stripe listen --api-key ${STRIPE_SECRET} --forward-to ${STRIPE_WEBHOOK_DOMAIN}/stripe/webhook"
        networks:
            - sail
            - kupoval_sail
        depends_on:
            - laravel.test

networks:
    sail:
        driver: bridge
    kupoval_sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
